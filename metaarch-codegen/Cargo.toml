[package]
name = "metaarch-codegen"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
metaarch-spec.workspace = true
# `rust` provides `qlift`/`name`; the `LiftTo` markers for the Python/Bash
# targets need no feature. Parsing of the `.rs.quilt` sources still happens at
# expansion time via `bin/expand` — but since phase 4c the generators also
# parse `impl` fragments with the real grammars at generation time, so
# `parse` (which vendors the rust + python tree-sitter parsers) and `python`
# (which exposes the python `Language`) are enabled too. `wgsl` exposes the
# wgsl `Language` the analytics generator's tests validate shaders with, and
# `sql` the one the schema, seed and migration generators reparse their own
# DDL with.
quilt = {workspace = true, features = ["parse", "python", "rust", "sql", "wgsl"]}
