[workspace]
members = [
  "metaarch",
  "metaarch-codegen",
  "metaarch-parser",
  "metaarch-spec",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = {version = "4", features = ["derive"]}
metaarch-codegen = {path = "metaarch-codegen"}
metaarch-parser = {path = "metaarch-parser"}
metaarch-spec = {path = "metaarch-spec"}
# Pinned so the runtime the expanded `.rs` generators compile against matches
# the expander (the sibling quilt checkout used by `bin/expand`), like
# nanobots. Bump deliberately: re-expand and rebuild when you do.
# Pinned to a rev (not a tag): the Nix lift marker the phase-3 generators need
# landed after v0.5.0; move back to a tag at the next quilt release.
quilt = {git = "https://github.com/QuiltLang/quilt.git", rev = "ba27c41", package = "quiltlang", default-features = false}
