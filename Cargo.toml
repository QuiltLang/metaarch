[workspace]
members = [
  "metaarch",
  "metaarch-codegen",
  "metaarch-expand",
  "metaarch-lang",
  "metaarch-lsp",
  "metaarch-parser",
  "metaarch-spec",
  "tree-sitter-arch",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = {version = "4", features = ["derive"]}
metaarch-codegen = {path = "metaarch-codegen"}
metaarch-parser = {path = "metaarch-parser"}
metaarch-spec = {path = "metaarch-spec"}
# Pinned so the runtime the expanded `.rs` generators compile against matches
# the expander (the sibling quilt checkout used by `bin/expand`), like
# nanobots. Bump deliberately: re-expand and rebuild when you do.
# Pinned to a rev (not a tag): the Nix lift marker the phase-3 generators need
# landed after v0.5.0, and SQL — the target language the DDL generators quote
# (QuiltLang/quilt#219, #234) — landed after that. Move back to a tag at the
# next quilt release.
quilt = {git = "https://github.com/QuiltLang/quilt.git", rev = "9348f65", package = "quiltlang", default-features = false}
# The LSP + editor-facing grammar (phase 4e). tree-sitter is pinned to the
# same minor quilt uses so one runtime serves the arch grammar and quilt's
# vendored ones; tower-lsp matches quilt-lsp's.
cc = "1"
serde_json = "1"
streaming-iterator = "0.1"
tokio = "1"
tower-lsp = "0.20"
tree-sitter = "0.26"
tree-sitter-arch = {path = "tree-sitter-arch"}
tree-sitter-language = "0.1"
