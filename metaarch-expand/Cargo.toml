[package]
name = "metaarch-expand"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
metaarch-lang = {path = "../metaarch-lang"}
# The full language set (each target feature implies `parse`/tree-sitter):
# this binary replaces the sibling-checkout `quilt expand` for this repo, so
# it must parse every host/target the generators use — plus dynamic `arch`.
quilt = {workspace = true, features = [
  "bash",
  "bootstrap",
  "html",
  "nix",
  "python",
  "rust",
  "sql",
  "text",
  "typescript",
  "wgsl",
  "zsh",
]}
